# Temporary on-push workflow: regenerate Composer lock at supported PHP 8.3 baseline.
name: Pin PHP 8.3 Compatible Dependencies
on:
  push:
    branches:
      - 'core/C29-core-integration'
    paths:
      - '.github/workflows/pin-core-dependencies.yml'
permissions:
  contents: write
jobs:
  pin:
    if: github.repository == 'parmtech/84pad-CMS' && github.ref == 'refs/heads/core/C29-core-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium, zip, mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Resolve baseline-compatible and audited dependency set
        run: |
          set -euo pipefail
          composer update --no-scripts --no-interaction --prefer-dist --no-progress
          composer validate --no-check-publish
          composer audit --no-dev --format=plain
          test -s composer.lock
      - name: Commit PHP 8.3 compatible lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(core): lock dependencies compatible with PHP 8.3 and 8.4"
            git push origin HEAD:refs/heads/core/C29-core-integration
          fi
