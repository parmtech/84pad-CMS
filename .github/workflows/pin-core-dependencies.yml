# One-shot development workflow. Remove after composer.lock has been committed and verified.
name: Pin Composer Dependencies (one-time)
on:
  push:
    branches:
      - 'core/C29-core-integration'
    paths:
      - '.github/workflows/pin-core-dependencies.yml'
permissions:
  contents: write
concurrency:
  group: 84pad-pin-core-dependencies
  cancel-in-progress: false
jobs:
  pin:
    if: github.repository == 'parmtech/84pad-CMS' && github.ref == 'refs/heads/core/C29-core-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Core development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, zip, mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo, openssl
          coverage: none
          tools: composer:v2
      - name: Resolve and audit lockfile
        run: |
          set -euo pipefail
          composer update --no-scripts --no-interaction --prefer-dist --no-progress
          composer validate --no-check-publish
          composer audit --no-dev --format=plain
          test -s composer.lock
      - name: Commit reproducible dependency lock to C29 only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(core): commit audited Composer dependency lock"
            git push origin HEAD:refs/heads/core/C29-core-integration
          fi
